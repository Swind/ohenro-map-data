# Minimal nginx config for the map-preview container.
#
# Listens on 5173 (matching the cloudflared tunnel target
# http://ohenro-map-preview:5173) and serves the built Vite app. Runs as root
# so workers can read the host `output/` volume even when files are 0600
# (owned by the host user). Range requests are enabled by default, which the
# pmtiles:// protocol needs.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_vary on;

    # Extra MIME types for the tile/data payloads (json already in mime.types).
    types {
        application/vnd.pmtiles pmtiles;
        application/x-protobuf pbf;
        application/json geojson;
    }

    server {
        listen 5173;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Data assets must exist; a missing file should 404 (never fall back
        # to the SPA index.html, which the app would try to parse as a tile).
        location /data/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}